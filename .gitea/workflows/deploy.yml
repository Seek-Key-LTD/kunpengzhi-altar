name: Build and Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: [raccoon]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          # 必须由仓库 secret 提供。曾在此处内嵌明文 token 作为兜底值，
          # 已移除 —— 兜底会让「secret 缺失」静默退化成「用泄露的凭据上线」。
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler pages deploy dist --project-name=kunpengzhi-altar --branch=main --commit-dirty=true
