name: Stage Deploy

on:
  push:
    branches:
      - stage
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Fleet Stage (CT157 Caddy)
    runs-on: [ static-runner ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          npm install --ignore-scripts --registry=https://registry.npmmirror.com

      - name: Build
        run: |
          npx vite build

      - name: Deploy to Fleet Caddy Staging
        run: |
          mkdir -p /var/www/html/altar
          rsync -av --delete dist/ /var/www/html/altar/
          echo "Successfully deployed to Staging directory: /var/www/html/altar/"

      - name: Health Check
        run: |
          # 验证本地 Caddy 与 Staging 端点响应
          curl -sf http://127.0.0.1/ | grep -q "华夏祭坛" || {
            echo "Local Caddy health check failed" >&2
            exit 1
          }
          echo "Stage deployment verified successfully: https://altar-staging.capitaltrain.cn/"

